# conda/mamba environment (alternative to requirements.txt):
#   mamba env create -f environment.yml && conda activate ashwatch
name: ashwatch
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy
  - scipy
  - gdal>=3.8
  - rasterio>=1.3
  - h5py
  - netcdf4
  - xarray
  - dask
  - geopandas
  - shapely>=2
  - pyproj
  - scikit-learn
  - pyyaml
  - requests
  - matplotlib
  - pillow
  - numba
  - pip
  - pip:
      - pysheds>=0.4
      - asf_search>=8
      - earthaccess>=0.11
      - pystac-client
      - cdsapi>=0.7
      # optional cross-check (step 13): pip install "pfdf @ git+https://code.usgs.gov/ghsc/lhp/pfdf.git"
