name: CI

# Runs on every pull request and on main. Three independent checks:
#   data      the exported files follow the data contract (tools/check_data.py)
#   web       the story site builds
#   pipeline  Python compiles and has no undefined names; smoke test on synthetic data when pipeline/ changes
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/check_data.py

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - name: Syntax and undefined names
        run: |
          python -m compileall -q pipeline tools
          pip install -q ruff
          ruff check pipeline tools --select E9,F63,F7,F82 --output-format=github
      - name: Did pipeline/ change?
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --quiet "$base" HEAD -- pipeline/ 2>/dev/null; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Smoke test of steps 03 to 12 on synthetic data
        if: steps.changed.outputs.run == 'true'
        continue-on-error: true    # informative until it has passed once on GitHub's runners
        working-directory: pipeline
        run: |
          pip install -q -r requirements.txt
          bash tests/run_synthetic.sh "$RUNNER_TEMP/aw_test"
