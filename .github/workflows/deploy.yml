name: Deploy site

# Every push to main that touches the site or its data rebuilds and publishes the story site on GitHub Pages.
# A data export that breaks the contract is not published: the live site keeps the last good version.
# One-off setup: repository Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/check_data.py', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      skip_data_check:
        description: Publish even if the data check fails (deadline escape hatch)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Data contract
        if: ${{ !inputs.skip_data_check }}
        run: python tools/check_data.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
